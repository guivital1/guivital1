<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img">
  <title>From raw data to useful insight</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090d0e"/>
      <stop offset="1" stop-color="#111718"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M120 155 C205 155 205 105 290 105 S375 205 460 205 S545 105 630 105 S715 155 800 155"/>
  </defs>

  <rect width="920" height="300" rx="18" fill="url(#bg)"/>
  <g opacity=".16" stroke="#94a3a6" stroke-width="1">
    <path d="M42 70H878M42 115H878M42 160H878M42 205H878M42 250H878"/>
    <path d="M100 45V260M220 45V260M340 45V260M460 45V260M580 45V260M700 45V260M820 45V260"/>
  </g>

  <text x="42" y="42" fill="#f4f4f0" font-family="ui-monospace,monospace" font-size="18" font-weight="700">PIPELINE_01</text>
  <circle cx="840" cy="36" r="4" fill="#a6e22e" filter="url(#glow)">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="852" y="41" fill="#7f8b8d" font-family="ui-monospace,monospace" font-size="11">RUNNING</text>

  <use href="#flow" fill="none" stroke="#2d383a" stroke-width="12" stroke-linecap="round"/>
  <use href="#flow" fill="none" stroke="#a6e22e" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 18">
    <animate attributeName="stroke-dashoffset" from="56" to="0" dur="2.2s" repeatCount="indefinite"/>
  </use>

  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <g transform="translate(120 155)">
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#151c1e" stroke="#415053"/>
      <text y="-3" fill="#a6e22e" font-size="12">01</text><text y="16" fill="#e8ece9" font-size="12">INGEST</text>
    </g>
    <g transform="translate(290 105)">
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#151c1e" stroke="#415053"/>
      <text y="-3" fill="#a6e22e" font-size="12">02</text><text y="16" fill="#e8ece9" font-size="12">TRANSFORM</text>
    </g>
    <g transform="translate(460 205)">
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#151c1e" stroke="#415053"/>
      <text y="-3" fill="#a6e22e" font-size="12">03</text><text y="16" fill="#e8ece9" font-size="12">ANALYZE</text>
    </g>
    <g transform="translate(630 105)">
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#151c1e" stroke="#415053"/>
      <text y="-3" fill="#a6e22e" font-size="12">04</text><text y="16" fill="#e8ece9" font-size="12">MODEL</text>
    </g>
    <g transform="translate(800 155)">
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#a6e22e" stroke="#c8f56b" filter="url(#glow)"/>
      <text y="-3" fill="#17200d" font-size="12">05</text><text y="16" fill="#17200d" font-size="12" font-weight="700">INSIGHT</text>
      <animateTransform attributeName="transform" type="translate" values="800 155;800 151;800 155" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#a6e22e" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="3" opacity=".7"><animateMotion dur="4.4s" begin="-1.5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="2" opacity=".5"><animateMotion dur="4.4s" begin="-3s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  </g>

  <text x="42" y="276" fill="#657174" font-family="ui-monospace,monospace" font-size="11">RAW_DATA → CLEAN_DATA → CONTEXT → DECISION</text>
</svg>
