<svg xmlns="http://www.w3.org/2000/svg" width="720" height="136" viewBox="0 0 720 136" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de dados</title>
<desc id="desc">Três fontes convergem em uma transformação e seguem como dados organizados. A animação respeita a preferência por movimento reduzido.</desc>
<style>
  .signal { stroke: #79c0ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 0.035 0.965; stroke-dashoffset: 1; animation: flow 6s linear infinite; }
  .second { animation-delay: -2s; }
  .third { animation-delay: -4s; }
  @keyframes flow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .signal { display: none; animation: none; } }
</style>
